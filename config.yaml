# Single source of truth for every generated parameter (see docs/data_dictionary.md)
seed: 42

rwa:
  num_wavelengths: 4        # W: 4 or 8
  top_k_requests: 20        # K: 10 / 20 / 40
  reach_km: 4000            # TODO: confirm after link lengths are computed (Step 1.7b)
  routes_per_request: 3     # first attempt
  max_routes: 5             # used by the feedback loop (Step 5.4)
  lightpath_capacity_mbps: 9920  # OC-192 usable rate, = Abilene link capacity in the SNDlib topology (Step 1.12)

csp:
  max_assignments: 1000000  # safety cap, returns status "timeout"

nn:
  seeds: [0, 1, 2, 3, 4]
  hidden: [64, 64]
  lr: 0.001
  batch_size: 256
  max_epochs: 100

split:
  train_hours: [0, 503]     # weeks 1-3
  test_hours: [504, 671]    # week 4
  val_last_days: 3

# Abilene router order (alphabetical). VERIFIED in Step 1.9: A.txt lists demands in this
# src-major order, and X01 slot 21 matches the SNDlib 20040301-0145 sample (Spearman 1.000).
node_order: [ATLAM5, ATLAng, CHINng, DNVRng, HSTNng, IPLSng, KSCYng, LOSAng, NYCMng, SNVAng, STTLng, WASHng]

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs
  abilene_topology: data/raw/topology/abilene_sndlib_native.txt
  germany50_topology: data/raw/topology/germany50.json
  sndlib_sample_matrix: data/raw/topology/demandMatrix-abilene-zhang-5min-20040301-0145.txt
